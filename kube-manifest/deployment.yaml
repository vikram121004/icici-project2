apiVersion: apps/v1
kind: Deployment

metadata:
  name: app1-nginx-deployment

  labels:
    app: app1-nginx

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app1-nginx

  template:
    metadata:
      labels:
        app: app1-nginx

    spec:
      containers:
        - name: app1-nginx

          image: nginx:latest

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service

metadata:
  name: app1-nginx-service

spec:
  type: LoadBalancer

  selector:
    app: app1-nginx

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80



